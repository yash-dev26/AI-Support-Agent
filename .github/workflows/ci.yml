name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall app tests

      - name: Run unit tests
        run: pytest tests/test_mock_db.py tests/test_ws_manager.py tests/test_graph_routing.py tests/test_faq.py tests/test_vector_store.py tests/test_policy_engine.py tests/test_escalation_store.py tests/test_escalation_flow.py tests/test_rate_limit.py tests/test_money_detection.py tests/test_guardrails.py tests/test_auth.py -v
        # test_concurrent_escalation.py and manual_eval_escalation.py are
        # integration/eval scripts requiring a live server + real Mongo/
        # OpenAI credentials — run them manually, not in CI.


